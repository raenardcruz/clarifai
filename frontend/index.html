<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="theme-color" content="#F5F5F7" />
  <title>ClarifAi — Intelligent Meeting Notes & Summaries</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=SF+Pro+Display:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    #app-boot-loader {
      position: fixed;
      inset: 0;
      z-index: 99999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #F5F5F7;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Inter", "Helvetica Neue", Arial, sans-serif;
      transition: opacity 0.28s cubic-bezier(0.16, 1, 0.3, 1), transform 0.28s cubic-bezier(0.16, 1, 0.3, 1);
      padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
    }
    #app-boot-loader.is-hidden {
      opacity: 0;
      transform: scale(1.015);
      pointer-events: none;
    }
    .boot-emblem-wrap {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 1.25rem;
    }
    .boot-halo {
      position: absolute;
      width: 86px;
      height: 86px;
      border-radius: 9999px;
      background: radial-gradient(circle, rgba(0, 113, 227, 0.24) 0%, rgba(175, 82, 222, 0.14) 52%, transparent 72%);
      animation: bootHaloPulse 2.1s ease-in-out infinite;
    }
    .boot-squircle {
      position: relative;
      width: 56px;
      height: 56px;
      border-radius: 16px;
      background: linear-gradient(135deg, #0071E3 0%, #5856D6 52%, #AF52DE 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 12px 28px -4px rgba(0, 113, 227, 0.35), 0 0 0 1px rgba(255, 255, 255, 0.35) inset;
    }
    .boot-title {
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: -0.025em;
      color: #1D1D1F;
      margin: 0 0 0.2rem 0;
    }
    .boot-sub {
      font-size: 0.82rem;
      font-weight: 500;
      color: #86868B;
      margin: 0 0 1.2rem 0;
    }
    .boot-wave {
      display: flex;
      align-items: center;
      gap: 4px;
      height: 20px;
      margin-bottom: 1rem;
    }
    .boot-wave span {
      width: 3.5px;
      height: 7px;
      border-radius: 9999px;
      background: linear-gradient(180deg, #0071E3 0%, #AF52DE 100%);
      animation: bootWave 1.1s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
    .boot-wave span:nth-child(2) { animation-delay: 0.12s; }
    .boot-wave span:nth-child(3) { animation-delay: 0.24s; }
    .boot-wave span:nth-child(4) { animation-delay: 0.36s; }
    .boot-wave span:nth-child(5) { animation-delay: 0.48s; }
    .boot-track {
      width: 132px;
      height: 3.5px;
      border-radius: 9999px;
      background: rgba(0, 0, 0, 0.08);
      overflow: hidden;
      position: relative;
    }
    .boot-runner {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 46%;
      border-radius: 9999px;
      background: linear-gradient(90deg, #0071E3 0%, #AF52DE 100%);
      animation: bootSlide 1.3s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
    @keyframes bootHaloPulse {
      0%, 100% { transform: scale(0.92); opacity: 0.65; }
      50% { transform: scale(1.12); opacity: 1; }
    }
    @keyframes bootWave {
      0%, 100% { height: 7px; opacity: 0.45; }
      50% { height: 19px; opacity: 1; }
    }
    @keyframes bootSlide {
      0% { transform: translateX(-110%); }
      100% { transform: translateX(230%); }
    }
    @media (prefers-reduced-motion: reduce) {
      .boot-halo, .boot-wave span, .boot-runner { animation: none; }
      .boot-wave span { height: 12px; opacity: 0.7; }
      .boot-runner { width: 100%; opacity: 0.55; }
    }
  </style>
</head>

<body>
  <div id="app-boot-loader" role="status" aria-live="polite" aria-label="Loading ClarifAi">
    <div class="boot-emblem-wrap">
      <div class="boot-halo"></div>
      <div class="boot-squircle">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z"/>
          <path d="M20 3v4"/><path d="M22 5h-4"/>
          <path d="M4 17v2"/><path d="M5 18H3"/>
        </svg>
      </div>
    </div>
    <div class="boot-wave" aria-hidden="true">
      <span></span><span></span><span></span><span></span><span></span>
    </div>
    <p class="boot-title">ClarifAi</p>
    <p class="boot-sub">Meeting Intelligence</p>
    <div class="boot-track" aria-hidden="true">
      <div class="boot-runner"></div>
    </div>
  </div>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>

</html>
